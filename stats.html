<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Hybrid: Rückkäufe & Türkei Zinsen</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    .hoch { background-color: #4CAF50; color: white; }
    .mittel { background-color: #FFD700; color: black; }
    .selten { background-color: #FF4500; color: white; }
    button { margin: 10px 5px; padding: 8px 12px; }
  </style>
  <script>
    let table;

    function saveLocal() {
      const rows = [];
      for (let i = 1; i < table.rows.length; i++) {
        const cells = table.rows[i].cells;
        rows.push({
          date: cells[0].innerText,
          usa: cells[1].innerText,
          ezb: cells[2].innerText,
          tr: cells[3].innerText,
          freq: cells[4].innerText,
          comment: cells[5].innerText
        });
      }
      localStorage.setItem("matrixData", JSON.stringify(rows));
    }

    function loadLocal() {
      const stored = localStorage.getItem("matrixData");
      if (stored) {
        const rows = JSON.parse(stored);
        rows.forEach(r => addRow(r.date, r.usa, r.ezb, r.tr, r.freq, r.comment));
      }
    }

    function addRow(date, usa, ezb, tr, freq, comment) {
      const row = table.insertRow();
      row.insertCell(0).innerText = date;
      row.insertCell(1).innerText = usa;
      row.insertCell(2).innerText = ezb;
      row.insertCell(3).innerText = tr;
      const freqCell = row.insertCell(4);
      freqCell.innerText = freq;
      freqCell.className = freq.toLowerCase();
      row.insertCell(5).innerText = comment;
    }

    async function fetchData() {
      // Hier würden die echten API-Abfragen laufen
      // Für den Ist-Zustand heute setzen wir Dummy-Werte
      const date = new Date().toLocaleDateString();
      const usaVal = "Aktiv";
      const ezbVal = "Nein";
      const tcmbVal = "Zins ↑";
      const freqText = "Mittel";

      addRow(date, usaVal, ezbVal, tcmbVal, freqText, "Ist-Zustand eingetragen am 24.08.2026");
      saveLocal();

      scheduleNextWednesday();
    }

    function scheduleNextWednesday() {
      const now = new Date();
      const next = new Date(now);
      next.setDate(now.getDate() + ((3 - now.getDay() + 7) % 7));
      next.setHours(12, 0, 0, 0);
      const delay = next.getTime() - now.getTime();
      setTimeout(fetchData, delay);
    }

    function downloadJSON() {
      const stored = localStorage.getItem("matrixData");
      if (!stored) return;
      const blob = new Blob([stored], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "matrixData.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function uploadJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const rows = JSON.parse(e.target.result);
        table.innerHTML = "<tr><th>Datum</th><th>USA Rückkäufe</th><th>EZB Rückkäufe</th><th>Türkei Zinsreaktion</th><th>Häufigkeit</th><th>Kommentar</th></tr>";
        rows.forEach(r => addRow(r.date, r.usa, r.ezb, r.tr, r.freq, r.comment));
        saveLocal();
      };
      reader.readAsText(file);
    }

    window.onload = () => {
      table = document.getElementById("matrix");
      loadLocal();
      fetchData(); // Sofortiger Ist-Zustand
    };
  </script>
</head>
<body>
  <h1>Hybrid: USA/EZB Rückkäufe & Türkei Zinsen</h1>
  <button onclick="downloadJSON()">Download JSON</button>
  <input type="file" id="uploadFile" accept=".json" onchange="uploadJSON(event)" style="display:none" />
  <button onclick="document.getElementById('uploadFile').click()">Upload JSON</button>

  <table id="matrix">
    <tr>
      <th>Datum</th>
      <th>USA Rückkäufe</th>
      <th>EZB Rückkäufe</th>
      <th>Türkei Zinsreaktion</th>
      <th>Häufigkeit</th>
      <th>Kommentar</th>
    </tr>
  </table>
</body>
</html>
