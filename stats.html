<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Hybrid: Rückkäufe & Türkei Zinsen</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    .hoch { background-color: #4CAF50; color: white; }
    .mittel { background-color: #FFD700; color: black; }
    .selten { background-color: #FF4500; color: white; }
    button { margin: 5px; padding: 6px 10px; }
  </style>
  <script>
    let table;

    function saveLocal() {
      const rows = [];
      for (let i = 1; i < table.rows.length; i++) {
        const cells = table.rows[i].cells;
        rows.push({
          date: cells[0].innerText,
          usa: cells[1].innerText,
          ezb: cells[2].innerText,
          tr: cells[3].innerText,
          freq: cells[4].innerText,
          comment: cells[5].innerText
        });
      }
      localStorage.setItem("matrixData", JSON.stringify(rows));
    }

    function loadLocal() {
      const stored = localStorage.getItem("matrixData");
      if (stored) {
        const rows = JSON.parse(stored);
        rows.forEach(r => addRow(r.date, r.usa, r.ezb, r.tr, r.freq, r.comment));
      }
    }

    function addRow(date, usa, ezb, tr, freq, comment) {
      const row = table.insertRow();
      row.insertCell(0).innerText = date;
      row.insertCell(1).innerText = usa;
      row.insertCell(2).innerText = ezb;
      row.insertCell(3).innerText = tr;
      const freqCell = row.insertCell(4);
      freqCell.innerText = freq;
      freqCell.className = freq.toLowerCase();
      row.insertCell(5).innerText = comment;
      const deleteCell = row.insertCell(6);
      const btn = document.createElement("button");
      btn.innerText = "Löschen";
      btn.onclick = () => { table.deleteRow(row.rowIndex); saveLocal(); };
      deleteCell.appendChild(btn);
    }

    async function fetchData() {
      try {
        // API-Abfragen
        const usa = await fetch("https://api.fiscaldata.treasury.gov/services/api/fmr/Buyback");
        const usaData = await usa.json();

        const ezb = await fetch("https://sdw.ecb.europa.eu/api/data/MP_OPS");
        const ezbData = await ezb.json();

        const tcmb = await fetch("https://evds2.tcmb.gov.tr/service/evds/series=TPOLICYRATE");
        const tcmbData = await tcmb.json();

        // Werte extrahieren
        const date = new Date().toLocaleDateString();
        const usaVal = usaData?.data?.[0]?.buyback_amount || 0;
        const ezbVal = ezbData?.data?.[0]?.operation_amount || 0;
        const tcmbVal = tcmbData?.items?.[0]?.value || 0;

        // Ampel-Logik
        let freqClass = "mittel";
        let freqText = "Mittel";
        if (usaVal > 0 && ezbVal > 0 && tcmbVal > 0) {
          freqClass = "hoch"; freqText = "Hoch";
        } else if ((usaVal > 0 || ezbVal > 0) && tcmbVal > 0) {
          freqClass = "mittel"; freqText = "Mittel";
        } else {
          freqClass = "selten"; freqText = "Selten";
        }

        // Eintrag hinzufügen
        addRow(
          date,
          usaVal > 0 ? "Aktiv" : "Nein",
          ezbVal > 0 ? "Aktiv" : "Nein",
          tcmbVal > 0 ? "Zins ↑" : "Zins ↓",
          freqText,
          "Ist-Zustand aus API"
        );
        saveLocal();

        // Nächsten Mittwoch planen
        scheduleNextWednesday();
      } catch (e) {
        console.error("Fehler beim Abrufen der Daten:", e);
      }
    }

    function scheduleNextWednesday() {
      const now = new Date();
      const next = new Date(now);
      next.setDate(now.getDate() + ((3 - now.getDay() + 7) % 7));
      next.setHours(12, 0, 0, 0);
      const delay = next.getTime() - now.getTime();
      setTimeout(fetchData, delay);
    }

    window.onload = () => {
      table = document.getElementById("matrix");
      loadLocal();
      fetchData(); // Sofortiger Ist-Zustand aus API
    };
  </script>
</head>
<body>
  <h1>Hybrid: USA/EZB Rückkäufe & Türkei Zinsen</h1>

  <table id="matrix">
    <tr>
      <th>Datum</th>
      <th>USA Rückkäufe</th>
      <th>EZB Rückkäufe</th>
      <th>Türkei Zinsreaktion</th>
      <th>Häufigkeit</th>
      <th>Kommentar</th>
      <th>Aktion</th>
    </tr>
  </table>
</body>
</html>
