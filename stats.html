<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Hybrid: Leitzins & Staatsanleihen</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: "Press Start 2P", monospace;
      padding: 20px;
    }
    h1 { text-align: center; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 2px solid #0f0; padding: 8px; text-align: center; }
    th { background-color: #111; cursor: pointer; }
    button {
      background-color: #111;
      color: #0f0;
      border: 2px solid #0f0;
      padding: 6px 12px;
      cursor: pointer;
      font-family: "Press Start 2P", monospace;
      margin: 4px;
    }
    button:hover { background-color: #0f0; color: #000; }
    input, select {
      background-color: #111;
      color: #0f0;
      border: 2px solid #0f0;
      padding: 4px;
      margin: 4px;
      font-family: "Press Start 2P", monospace;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script>
    let table;

    function saveLocal() {
      const rows = [];
      for (let i = 1; i < table.rows.length; i++) {
        const cells = table.rows[i].cells;
        rows.push({
          date: cells[0].innerText,
          land: cells[1].innerText,
          leitzins: cells[2].innerText.replace(" %",""), // nur Zahl speichern
          bond: cells[3].innerText.replace(" %","")      // nur Zahl speichern
        });
      }
      localStorage.setItem("matrixData", JSON.stringify(rows));
    }

    function loadLocal() {
      const stored = localStorage.getItem("matrixData");
      if (stored) {
        const rows = JSON.parse(stored);
        rows.forEach(r => addRow(r.date, r.land, r.leitzins, r.bond));
      }
    }

    function addRow(date, land, leitzins, bond) {
      const row = table.insertRow();
      row.insertCell(0).innerText = date;
      row.insertCell(1).innerText = land;
      row.insertCell(2).innerText = leitzins + " %";   // Anzeige mit %
      row.insertCell(3).innerText = bond + " %";       // Anzeige mit %
      const deleteCell = row.insertCell(4);
      const btn = document.createElement("button");
      btn.innerText = "Löschen";
      btn.onclick = () => { table.deleteRow(row.rowIndex); saveLocal(); };
      deleteCell.appendChild(btn);
    }

    function addEntry() {
      const date = document.getElementById("date").value;
      const land = document.getElementById("land").value;
      const leitzins = document.getElementById("leitzins").value;
      const bond = document.getElementById("bond").value;
      if (!date || !land || !leitzins || !bond) {
        alert("Bitte alle Felder ausfüllen!");
        return;
      }
      addRow(date, land, leitzins, bond);
      saveLocal();
    }

    function downloadJSON() {
      const stored = localStorage.getItem("matrixData");
      if (!stored) return;
      const blob = new Blob([stored], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "matrixData.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function uploadJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const rows = JSON.parse(e.target.result);
        table.innerHTML = "<tr><th onclick='sortTable(1)'>Land</th><th>Datum</th><th>Leitzins</th><th>1J Staatsanleihe</th><th>Aktion</th></tr>";
        rows.forEach(r => addRow(r.date, r.land, r.leitzins, r.bond)); // hier wieder % anhängen
        saveLocal();
      };
      reader.readAsText(file);
    }

    function sortTable(colIndex) {
      let rows = Array.from(table.rows).slice(1);
      rows.sort((a, b) => a.cells[colIndex].innerText.localeCompare(b.cells[colIndex].innerText));
      rows.forEach(r => table.appendChild(r));
    }

    window.onload = () => {
      table = document.getElementById("matrix");
      loadLocal();
    };
  </script>
</head>
<body>
  <h1>Hybrid: Leitzins & Staatsanleihen</h1>

  <!-- Navigation Buttons -->
  <div style="text-align:center; margin-bottom:20px;">
    <button onclick="location.href='https://codexboru.github.io/bond/README.html'">🕹 README</button>
    <button onclick="location.href='https://codexboru.github.io/bond/index.html'">🕳 Bond</button>
    <button onclick="location.href='https://github.com/codexboru'">😶‍🌫️ Codexboru Profil</button>
    <button onclick="location.href='https://codexboru.github.io/bond/money.html'">🐈 M2 / M3</button>
  </div>

  <div>
    <input type="date" id="date">
    <select id="land">
      <option value="USA">USA</option>
      <option value="EZB">EZB</option>
      <option value="TRY">TRY</option>
      <option value="JPY">JPY</option>
      <option value="ENG">ENG</option>
    </select>
    <input type="number" id="leitzins" placeholder="Leitzins %" step="0.01">
    <input type="number" id="bond" placeholder="1J Staatsanleihe %" step="0.01">
    <button onclick="addEntry()">Eintrag hinzufügen</button>
  </div>

  <button onclick="downloadJSON()">Download</button>
  <input type="file" id="uploadFile" accept=".json" onchange="uploadJSON(event)" style="display:none" />
  <button onclick="document.getElementById('uploadFile').click()">Upload</button>

  <table id="matrix">
    <tr>
      <th onclick="sortTable(1)">Land</th>
      <th>Datum</th>
      <th>Leitzins</th>
      <th>1J Bond</th>
      <th>Delete</th>
    </tr>
  </table>
  <script>
  fetch('data/stats.json')
    .then(response => response.json())
    .then(data => {
      const tbody = document.querySelector('#statsTable tbody');
      data.forEach(entry => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${entry.date}</td>
          <td>${entry.land}</td>
          <td>${entry.leitzins}%</td>
          <td>${entry.bond}</td>
        `;
        tbody.appendChild(row);
      });
    })
    .catch(err => console.error('Fehler beim Laden stats.json:', err));
    </script>
</body>
</html>
