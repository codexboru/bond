<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Zinsen & Staatsanleihen – Übersicht</title>
  <style>
    body {
      background-color: black;
      color: #00ff00;
      font-family: monospace;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #00ff00;
      padding: 6px;
      text-align: left;
    }
    input, select, button {
      background-color: black;
      color: #00ff00;
      border: 1px solid #00ff00;
      font-family: monospace;
      margin: 4px;
    }
    .btn {
      cursor: pointer;
      padding: 6px 12px;
      margin: 2px;
    }
    .nav {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .nav a, .nav button {
      border: 1px solid #00ff00;
      background-color: black;
      color: #00ff00;
      font-family: monospace;
      text-decoration: none;
      padding: 6px 12px;
    }
  </style>
</head>
<body>
  <h1>Zinsen & Staatsanleihen – Übersicht</h1>

  <!-- Navigation Buttons mit Links -->
  <div class="nav">
    <a href="#" onclick="toggleTheme()">☀️🌙</a>
    <a href="index.html">🕳 bond_calculator</a>
    <a href="README.html">🕹 README.md</a>
    <a href="https://www.github.com/codexboru">😶‍🌫️ codexboru profile</a>
    <a href="money.html">🐈 M2 / M3</a>
    <a href="stats.html">📊 Stats</a>
    <a href="#" onclick="downloadJSON()">💾 Download</a>
    <label for="uploadFile" style="cursor:pointer;">Upload</label>
     <input type="file" id="uploadFile" accept=".json,application/json" onchange="uploadJSON()" style="display:none;" />
</div>
  

  <!-- Eingabeformular -->
  <form id="entryForm">
    <label>Datum: <input type="date" id="date"></label>
    <label>Land: <input type="text" id="land"></label>
    <label>Leitzins: <input type="text" id="leitzins"></label>
    <label>Kaufkurs (1J): <input type="text" id="bond_kaufkurs"></label>
    <label>Status/Event: <input type="text" id="status"></label>
    <button type="button" class="btn" onclick="addEntry()">Eintrag hinzufügen</button>
  </form>

  <!-- Tabelle -->
  <table id="dataTable">
    <thead>
      <tr>
        <th>Datum</th>
        <th>Land</th>
        <th>Leitzins</th>
        <th>Kaufkurs (1J)</th>
        <th>Status/Event</th>
        <th>Löschen</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    let data = [
      {"date":"2000-03-10","land":"USA","leitzins":6.5,"bond_kaufkurs":94.5,"status":"Dotcom-Blase Höhepunkt"},
      {"date":"2001-02-21","land":"TR","leitzins":62.0,"bond_kaufkurs":72.0,"status":"Türkei Bankenkrise"},
      {"date":"2008-09-15","land":"USA","leitzins":2.0,"bond_kaufkurs":98.3,"status":"Lehman Brothers Pleite"},
      {"date":"2010-05-01","land":"EU","leitzins":1.0,"bond_kaufkurs":99.1,"status":"Eurokrise"},
      {"date":"2018-08-15","land":"TR","leitzins":17.75,"bond_kaufkurs":85.0,"status":"Lira-Krise"},
      {"date":"2020-03-15","land":"USA","leitzins":0.25,"bond_kaufkurs":99.8,"status":"Corona-Crash"},
      {"date":"2026-08-25","land":"TRY","leitzins":37,"bond_kaufkurs":86.24,"status":"Aktuell"},
      {"date":"2026-08-25","land":"USA","leitzins":3.63,"bond_kaufkurs":98.5,"status":"Aktuell"},
      {"date":"2026-08-25","land":"ENG","leitzins":4,"bond_kaufkurs":96,"status":"Aktuell"},
      {"date":"2026-08-25","land":"JPY","leitzins":0.5,"bond_kaufkurs":99,"status":"Aktuell"},
      {"date":"2026-08-25","land":"EZB","leitzins":2.4,"bond_kaufkurs":97.4,"status":"Aktuell"}
    ];

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      data.forEach((entry, index) => {
        const row = document.createElement("tr");
        Object.values(entry).forEach(val => {
          const cell = document.createElement("td");
          cell.textContent = val;
          row.appendChild(cell);
        });
        const delCell = document.createElement("td");
        const delBtn = document.createElement("button");
        delBtn.textContent = "X";
        delBtn.onclick = () => { data.splice(index,1); renderTable(); };
        delCell.appendChild(delBtn);
        row.appendChild(delCell);
        tbody.appendChild(row);
      });
    }

    function addEntry() {
      const newEntry = {
        date: document.getElementById("date").value,
        land: document.getElementById("land").value,
        leitzins: document.getElementById("leitzins").value,
        bond_kaufkurs: document.getElementById("bond_kaufkurs").value,
        status: document.getElementById("status").value
      };
      data.push(newEntry);
      renderTable();
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "stats.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function uploadJSON() {
      const file = document.getElementById("uploadFile").files[0];
      const reader = new FileReader();
      reader.onload = e => {
        data = JSON.parse(e.target.result);
        renderTable();
      };
      reader.readAsText(file);
    }

    function toggleTheme() {
      document.body.style.backgroundColor =
        document.body.style.backgroundColor === "black" ? "#111" : "black";
    }

    renderTable();
  </script>
</body>
</html>
