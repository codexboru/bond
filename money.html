<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>M2/M3 Übersicht</title>
  <style>
    body {
      font-family: monospace;
      background-color: #111;
      color: #eee;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #555;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #333;
    }
    .green { background-color: #2e7d32; }
    .yellow { background-color: #f9a825; }
    .red { background-color: #c62828; }
    button {
      margin: 5px;
      padding: 6px 10px;
      background-color: #444;
      color: #eee;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    .nav {
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <h1>M2/M3 Geldmengen – Übersicht</h1>

  <!-- Navigation -->
  <div class="nav">
    <button onclick="window.location.href='https://github.com/codexboru'">😶‍🌫️ codexboru profile</button>
    <button onclick="window.location.href='README.html'">🕹 README</button>
    <button onclick="window.location.href='stats.html'">📊 stats</button>
    <button onclick="window.location.href='index.html'">🕳 bond_calculator</button>
  </div>

  <!-- Manuelle Eingabe -->
  <h2>Neuen Eintrag hinzufügen</h2>
  <form id="entryForm">
    <label>Land:
      <select id="land">
        <option>USA</option>
        <option>TR</option>
        <option>UK</option>
        <option>JPY</option>
        <option>EZB</option>
      </select>
    </label>
    <label>Monat: <input type="text" id="monat" placeholder="z.B. Juli"></label>
    <label>Jahr: <input type="number" id="jahr" value="2026"></label>
    <label>M2: <input type="text" id="m2"></label>
    <label>M3: <input type="text" id="m3"></label>
    <label>Status: <input type="text" id="status"></label>
    <button type="button" onclick="addEntry()">Hinzufügen</button>
  </form>

  <!-- Tabelle -->
  <table id="m2m3Table">
    <tr>
      <th>Datum</th>
      <th>Land</th>
      <th>M2</th>
      <th>M3</th>
      <th>Status</th>
      <th>Zinserwartung</th>
      <th>Löschen</th>
    </tr>
    <tr>
      <td>Juli 2026</td>
      <td>USA</td>
      <td>23.003 Mrd. USD</td>
      <td>≈23.5 Tsd. Mrd. USD</td>
      <td class="red">Überhitzung</td>
      <td>Erhöhung</td>
      <td><button onclick="deleteRow(this)">X</button></td>
    </tr>
  </table>

  <button onclick="downloadJSON()">Download JSON</button>
  <input type="file" id="uploadJSON" accept=".json" onchange="uploadJSON(event)">

  <script>
    function zinserwartung(status) {
      if (status.toLowerCase().includes("überhitzung") || status.toLowerCase().includes("inflation")) {
        return "Erhöhung";
      } else if (status.toLowerCase().includes("niedrig") || status.toLowerCase().includes("stagnation")) {
        return "Reduzierung";
      } else {
        return "Halten";
      }
    }

    function addEntry() {
      const land = document.getElementById("land").value;
      const monat = document.getElementById("monat").value;
      const jahr = document.getElementById("jahr").value;
      const m2 = document.getElementById("m2").value;
      const m3 = document.getElementById("m3").value;
      const status = document.getElementById("status").value;
      const zinserw = zinserwartung(status);

      const table = document.getElementById("m2m3Table");
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${monat} ${jahr}</td>
        <td>${land}</td>
        <td>${m2}</td>
        <td>${m3}</td>
        <td>${status}</td>
        <td>${zinserw}</td>
        <td><button onclick="deleteRow(this)">X</button></td>
      `;
      table.appendChild(row);
    }

    function deleteRow(btn) {
      const row = btn.parentNode.parentNode;
      row.parentNode.removeChild(row);
    }

    function downloadJSON() {
      const table = document.getElementById("m2m3Table");
      const rows = table.querySelectorAll("tr");
      const data = [];
      rows.forEach((row, index) => {
        if (index === 0) return; // skip header
        const cells = row.querySelectorAll("td");
        if (cells.length > 0) {
          data.push({
            datum: cells[0].innerText,
            land: cells[1].innerText,
            M2: cells[2].innerText,
            M3: cells[3].innerText,
            status: cells[4].innerText,
            zinserwartung: cells[5].innerText
          });
        }
      });
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "m2m3.json";
      link.click();
    }

    function uploadJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const data = JSON.parse(e.target.result);
        const table = document.getElementById("m2m3Table");
        // remove old rows
        table.querySelectorAll("tr:not(:first-child)").forEach(r => r.remove());
        // add new rows
        data.forEach(item => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.datum}</td>
            <td>${item.land}</td>
            <td>${item.M2}</td>
            <td>${item.M3}</td>
            <td>${item.status}</td>
            <td>${item.zinserwartung}</td>
            <td><button onclick="deleteRow(this)">X</button></td>
          `;
          table.appendChild(row);
        });
      };
      reader.readAsText(file);
    }
  </script>

  <script>
  fetch('data/money.json')
    .then(response => response.json())
    .then(data => {
      const table = document.getElementById('m2m3Table'); // richtige ID
      data.forEach(entry => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${entry.monat} ${entry.jahr}</td>
          <td>${entry.land}</td>
          <td>${entry.M2}</td>
          <td>${entry.M3}</td>
          <td>${entry.status}</td>
          <td>${entry.zinserwartung}</td>
          <td><button onclick="deleteRow(this)">X</button></td>
        `;
        table.appendChild(row);
      });
    })
    .catch(err => console.error('Fehler beim Laden money.json:', err));
</script>
</body>
</html>
