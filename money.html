<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>M2/M3 Übersicht</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: "Press Start 2P", monospace;
      padding: 20px;
    }
    h1 { text-align: center; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 2px solid #0f0; padding: 8px; text-align: center; }
    th { background-color: #111; cursor: pointer; }
    button {
      background-color: #111;
      color: #0f0;
      border: 2px solid #0f0;
      padding: 6px 12px;
      cursor: pointer;
      font-family: "Press Start 2P", monospace;
      margin: 4px;
    }
    button:hover { background-color: #0f0; color: #000; }
    input, select {
      background-color: #111;
      color: #0f0;
      border: 2px solid #0f0;
      padding: 4px;
      margin: 4px;
      font-family: "Press Start 2P", monospace;
    }
    .day {
      background-color: #fff;
      color: #000;
    }
    .day th, .day td {
      border: 2px solid #000;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <h1>M2/M3 Geldmengen – Übersicht</h1>

  <!-- Navigation -->
  <div style="text-align:center; margin-bottom:20px;">
    <button onclick="window.location.href='https://github.com/codexboru'">😶‍🌫️ Profil</button>
    <button onclick="window.location.href='README.html'">🕹 README</button>
    <button onclick="window.location.href='stats.html'">📊 stats</button>
    <button onclick="window.location.href='index.html'">🕳 bond_calculator</button>
    <button onclick="toggleTheme()">☀️ 🌛</button>
  </div>

  <!-- Eingabe -->
  <div>
    <input type="text" id="monat" placeholder="Monat">
    <input type="number" id="jahr" value="2026">
    <select id="land">
      <option>USA</option>
      <option>TR</option>
      <option>UK</option>
      <option>JPY</option>
      <option>EZB</option>
    </select>
    <input type="text" id="m2" placeholder="M2">
    <input type="text" id="m3" placeholder="M3">
    <input type="text" id="status" placeholder="Status">
    <button onclick="addEntry()">Eintrag hinzufügen</button>
  </div>

  <button onclick="downloadJSON()">Download JSON</button>
  <input type="file" id="uploadJSON" accept=".json" onchange="uploadJSON(event)" style="display:none" />
  <button onclick="document.getElementById('uploadJSON').click()">Upload JSON</button>

  <!-- Tabelle -->
  <table id="m2m3Table">
    <tr>
      <th>Datum</th>
      <th>Land</th>
      <th>M2</th>
      <th>M3</th>
      <th>Status</th>
      <th>Zinserwartung</th>
      <th>Löschen</th>
    </tr>
  </table>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("day");
    }

    function zinserwartung(status) {
      if (status.toLowerCase().includes("überhitzung") || status.toLowerCase().includes("inflation")) {
        return "Erhöhung";
      } else if (status.toLowerCase().includes("niedrig") || status.toLowerCase().includes("stagnation")) {
        return "Reduzierung";
      } else {
        return "Halten";
      }
    }

    function existsEntry(datum, land) {
      const rows = document.querySelectorAll("#m2m3Table tr");
      for (let i = 1; i < rows.length; i++) {
        const cells = rows[i].querySelectorAll("td");
        if (cells.length > 0 && cells[0].innerText === datum && cells[1].innerText === land) {
          return true;
        }
      }
      return false;
    }

    function addEntry() {
      const land = document.getElementById("land").value;
      const monat = document.getElementById("monat").value;
      const jahr = document.getElementById("jahr").value;
      const m2 = document.getElementById("m2").value;
      const m3 = document.getElementById("m3").value;
      const status = document.getElementById("status").value;
      const zinserw = zinserwartung(status);
      const datum = `${monat} ${jahr}`;

      if (existsEntry(datum, land)) return;

      const table = document.getElementById("m2m3Table");
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${datum}</td>
        <td>${land}</td>
        <td>${m2}</td>
        <td>${m3}</td>
        <td>${status}</td>
        <td>${zinserw}</td>
        <td><button onclick="deleteRow(this)">X</button></td>
      `;
      table.appendChild(row);
    }

    function deleteRow(btn) {
      const row = btn.parentNode.parentNode;
      row.parentNode.removeChild(row);
    }

    function downloadJSON() {
      const table = document.getElementById("m2m3Table");
      const rows = table.querySelectorAll("tr");
      const data = [];
      rows.forEach((row, index) => {
        if (index === 0) return;
        const cells = row.querySelectorAll("td");
        if (cells.length > 0) {
          data.push({
            datum: cells[0].innerText,
            land: cells[1].innerText,
            M2: cells[2].innerText,
            M3: cells[3].innerText,
            status: cells[4].innerText,
            zinserwartung: cells[5].innerText
          });
        }
      });
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "money.json";
      link.click();
    }

    function uploadJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const data = JSON.parse(e.target.result);
        const table = document.getElementById("m2m3Table");
        table.querySelectorAll("tr:not(:first-child)").forEach(r => r.remove());
        data.forEach(item => {
          if (!existsEntry(item.datum, item.land)) {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${item.datum}</td>
              <td>${item.land}</td>
              <td>${item.M2}</td>
              <td>${item.M3}</td>
              <td>${item.status}</td>
              <td>${item.zinserwartung}</td>
              <td><button onclick="deleteRow(this)">X</button></td>
            `;
            table.appendChild(row);
          }
        });
      };
      reader.readAsText(file);
    }

    // fetch mit Prüfung
    fetch('data/money.json')
      .then(response => response.json())
      .then(data => {
        const table = document.getElementById('m2m3Table');
        data.forEach(entry => {
          if (!existsEntry(entry.datum, entry.land)) {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${entry.datum}</td>
              <td>${entry.land}</td>
              <td>${entry.M2}</td>
              <td>${entry.M3}</td>
              <td>${entry.status}</td>
              <td>${entry.zinserwartung}</td>
              <td><button onclick="deleteRow(this)">X</button></td>
            `;
            table.appendChild(row);
          }
        });
      })
      .catch(err => console.error('Fehler beim Laden money.json:', err));
  </script>
</body>
</html>
