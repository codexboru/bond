  <button onclick="openPopup()">+ Asset hinzufügen</button>

  <div>
    <label for="filterDate">Filter nach Datum:</label>
    <input type="date" id="filterDate">
    <button onclick="filterByDate()">Filtern</button>
    <button onclick="clearFilter()">Alle anzeigen</button>
  </div>

  <div id="entries"></div>
  <p id="total">Gesamtsumme: –</p>
  <p id="status"></p>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Auswahl-Popup -->
  <div id="popup">
    <h3>Assets:</h3>
    <button onclick="selectOption('ASTER Krypto')">ASTER Token</button>
    <button onclick="selectOption('Bond')">Bond</button>
    <button onclick="selectOption('Zinseszins')">Zinseszins</button>
    <br><br>
    <button onclick="closePopup()">Schließen</button>
  </div>

  <!-- Betrag-Popup -->
  <div id="popupAmount">
    <h3>Betrag eingeben:</h3>
    <input type="number" id="amountInput" placeholder="Betrag in TRY">
    <br><br>
    <button onclick="saveAmount()">Speichern</button>
    <button onclick="closePopupAmount()">Schließen</button>
  </div>

  <script>
    let currentSelection = null;
    let assets = [];

    function openPopup() {
      document.getElementById('overlay').style.display = 'block';
      document.getElementById('popup').style.display = 'block';
    }
    function closePopup() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('popup').style.display = 'none';
    }
    function selectOption(value) {
      currentSelection = value;
      closePopup();
      openPopupAmount();
    }
    function openPopupAmount() {
      document.getElementById('overlay').style.display = 'block';
      document.getElementById('popupAmount').style.display = 'block';
    }
    function closePopupAmount() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('popupAmount').style.display = 'none';
    }
    function saveAmount() {
      const amount = document.getElementById('amountInput').value;
      if(amount && currentSelection) {
        const today = new Date().toLocaleDateString('de-DE');
        const entry = {

          function saveAmount() {
      const amount = document.getElementById('amountInput').value;
      if(amount && currentSelection) {
        const today = new Date().toLocaleDateString('de-DE');
        const entry = { type: currentSelection, amount: parseFloat(amount), date: today };
        assets.push(entry);
        renderEntries();
        document.getElementById('status').textContent = ">> 1 Asset gespeichert!";
      }
      document.getElementById('amountInput').value = "";
      closePopupAmount();
    }

    function renderEntries(list = assets) {
      const container = document.getElementById('entries');
      container.innerHTML = "";
      let totalSum = 0;
      list.forEach((inv, index) => {
        totalSum += inv.amount;
        const p = document.createElement('p');
        p.className = "entry";
        p.textContent = inv.type + ": " + inv.amount + " TRY (Datum: " + inv.date + ")";
        const delBtn = document.createElement('button');
        delBtn.textContent = "X";
        delBtn.className = "deleteBtn";
        delBtn.onclick = () => { deleteEntry(index); };
        p.appendChild(delBtn);
        container.appendChild(p);
      });
      document.getElementById('total').textContent = "Gesamtsumme: " + totalSum + " TRY";
    }

    function deleteEntry(index) {
      assets.splice(index, 1);
      renderEntries();
      document.getElementById('status').textContent = ">> Asset gelöscht!";
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(assets, null, 2)], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "wallet.json";
      a.click();
      URL.revokeObjectURL(url);
      document.getElementById('status').textContent = ">> Datei wallet.json gespeichert!";
    }

    function uploadJSON() {
      const file = document.getElementById("uploadFile").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          assets = JSON.parse(e.target.result);
          renderEntries();
          document.getElementById('status').textContent = ">> " + assets.length + " Assets erfolgreich geladen!";
        } catch (err) {
          alert("Ungültige JSON-Datei!");
        }
      };
      reader.readAsText(file);
    }

    function filterByDate() {
      const filterDate = document.getElementById('filterDate').value;
      if(filterDate) {
        const formatted = new Date(filterDate).toLocaleDateString('de-DE');
        const filtered = assets.filter(inv => inv.date === formatted);
        renderEntries(filtered);
        document.getElementById('status').textContent = ">> Filter angewendet!";
      }
    }

    function clearFilter() {
      renderEntries();
      document.getElementById('status').textContent = ">> Filter zurückgesetzt!";
    }
  </script>

</body>
</html>
