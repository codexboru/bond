name: Release Archive

on:
  push:
    tags:
      - 'v*'   # läuft nur bei Tags wie v2026.07.01

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          jq . data/money.json
          jq . data/stats.json

      - name: Create Release Archives
        run: |
          mkdir dist
          cp index.html money.html stats.html README.html README.md LICENSE favicon.png data/money.json data/stats.json dist/
          tar -czf bond-${{ github.ref_name }}.tar.gz -C dist .
          zip -r bond-${{ github.ref_name }}.zip dist

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: |
            bond-${{ github.ref_name }}.tar.gz
            bond-${{ github.ref_name }}.zip
