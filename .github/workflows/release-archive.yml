name: Release Archive

on:
  push:
    tags:
      - 'v*'   # läuft nur bei Tags wie v2026.07.01

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Validate JSON
        run: |
          jq . data/money.json
          jq . data/stats.json

      - name: Create Release Archive
        run: |
          mkdir release
          cp money.json stats.json money.html stats.html README.md release/
          tar -czf bond-${{ github.ref_name }}.tar.gz release
          zip -r bond-${{ github.ref_name }}.zip release

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: |
            bond-${{ github.ref_name }}.tar.gz
            bond-${{ github.ref_name }}.zip
