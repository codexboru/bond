name: Release Archive

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create Release Archives
        run: |
          mkdir -p dist
          zip -r dist/bond-${{ github.ref_name }}.zip .
          tar -czf dist/bond-${{ github.ref_name }}.tar.gz .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/bond-${{ github.ref_name }}.zip
            dist/bond-${{ github.ref_name }}.tar.gz
